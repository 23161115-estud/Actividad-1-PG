<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 14 Números: Mayor, Menor y Promedio</title>
    <link rel="stylesheet" href="css/ejercicio14.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Análisis de Números</h1>
        <p class="subtitulo">Ingresa varios números separados por comas.</p>

        <form id="formulario-conversor" class="formulario" novalidate>
            <div class="grupo-formulario">
                <label for="numeros">Números (separalos con una ,)</label>
                <input type="text" id="numeros" placeholder="Ej: 10, 20, 30, 40, 50" autocomplete="off">
                <span id="mensaje-error" class="mensaje-error"></span>
            </div>

            <button type="button" id="btn-calcular" class="boton-enviar">
                Calcular <span>→</span>
            </button>

            <div class="grupo-formulario">
                <label for="mayor">Número Mayor</label>
                <input type="text" id="mayor" placeholder="Resultado" readonly>
            </div>

            <div class="grupo-formulario">
                <label for="menor">Número Menor</label>
                <input type="text" id="menor" placeholder="Resultado" readonly>
            </div>

            <div class="grupo-formulario">
                <label for="promedio">Promedio</label>
                <input type="text" id="promedio" placeholder="Resultado" readonly>
            </div>
        </form>
    </div>

    <script src="js/ejercicio14.js"></script>
</body>
</html>
