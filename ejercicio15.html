<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15 Calificaciones de Estudiantes</title>
    <link rel="stylesheet" href="css/ejercicio15.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Calificaciones de Estudiantes</h1>
        <p class="subtitulo">Agrega estudiantes con su nombre y calificación.</p>

        <form id="formulario-conversor" class="formulario" novalidate>
            <div class="grupo-formulario">
                <label for="nombre">Nombre del Estudiante</label>
                <input type="text" id="nombre" placeholder="Ej: Juan" autocomplete="off">
            </div>

            <div class="grupo-formulario">
                <label for="calificacion">Calificación</label>
                <input type="text" id="calificacion" placeholder="Ej: 85" autocomplete="off">
                <span id="mensaje-error" class="mensaje-error"></span>
            </div>

            <button type="button" id="btn-agregar" class="boton-enviar boton-secundario">
                Agregar estudiante <span>+</span>
            </button>

            <div class="grupo-formulario">
                <label>Estudiantes agregados</label>
                <ul id="lista-estudiantes" class="lista-estudiantes">
                    <li class="lista-vacia">Aún no hay estudiantes agregados.</li>
                </ul>
            </div>

            <button type="button" id="btn-calcular" class="boton-enviar">
                Calcular <span>→</span>
            </button>

            <div class="grupo-formulario">
                <label for="promedio">Calificación Promedio</label>
                <input type="text" id="promedio" placeholder="Resultado" readonly>
            </div>

            <div class="grupo-formulario">
                <label for="mejor-estudiante">Calificación más alta</label>
                <input type="text" id="mejor-estudiante" placeholder="Resultado" readonly>
            </div>

            <div class="grupo-formulario">
                <label for="peor-estudiante">Calificación más baja</label>
                <input type="text" id="peor-estudiante" placeholder="Resultado" readonly>
            </div>
        </form>
    </div>

    <script src="js/ejercicio15.js"></script>
</body>
</html>
