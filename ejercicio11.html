<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 Conversor de Kilómetros a Millas</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Conversor de Distancia</h1>
        <p class="subtitulo">Ingresa la distancia en kilómetros.</p>

        <form id="formulario-conversor" class="formulario" novalidate>
            <div class="grupo-formulario">
                <label for="kilometros">Distancia en Kilómetros (Km)</label>
                <input type="text" id="kilometros" placeholder="Ej: 10" autocomplete="off">
                <span id="mensaje-error" class="mensaje-error"></span>
            </div>

            <button type="button" id="btn-convertir" class="boton-enviar">
                Convertir <span>→</span>
            </button>

            <div class="grupo-formulario">
                <label for="millas">Distancia en Millas (mi)</label>
                <input type="text" id="millas" placeholder="Resultado en millas" readonly>
            </div>
        </form>
    </div>

    <script src="js/ejercicio11.js"></script>
</body>
</html>
