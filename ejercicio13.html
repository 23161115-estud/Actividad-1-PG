<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 13 Verificador de Edad para Votar</title>
    <link rel="stylesheet" href="css/ejercicio13.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Verificador de Edad</h1>
        <p class="subtitulo">Ingresa tu edad para saber si puedes votar.</p>

        <form id="formulario-conversor" class="formulario" novalidate>
            <div class="grupo-formulario">
                <label for="edad">Edad</label>
                <input type="text" id="edad" placeholder="Ej: 20" autocomplete="off">
                <span id="mensaje-error" class="mensaje-error"></span>
            </div>

            <button type="button" id="btn-verificar" class="boton-enviar">
                Verificar <span>→</span>
            </button>

            <div class="grupo-formulario">
                <label for="resultado">Resultado</label>
                <input type="text" id="resultado" placeholder="Aquí verás si puedes votar" readonly>
            </div>
        </form>
    </div>

    <script src="js/ejercicio13.js"></script>
</body>
</html>
