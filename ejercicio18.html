<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 18 Manipulación del DOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/ejercicio18.css">
</head>
<body>
    <div class="container py-5">
        <div class="card mx-auto shadow-sm border-0" style="max-width: 480px;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-2 titulo-principal">Agregar y Eliminar Elementos</h1>
                <p class="text-muted small mb-4">Escribe algo y agrégalo a la lista.</p>

                <div class="input-group mb-2">
                    <input type="text" id="nuevoElemento" class="form-control" placeholder="Escribe algo" autocomplete="off">
                    <button id="agregarBtn" class="btn btn-morado" type="button">Agregar</button>
                </div>
                <div id="mensaje-error" class="form-text text-danger mb-3"></div>

                <ul id="lista" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/ejercicio18.js"></script>
</body>
</html>
